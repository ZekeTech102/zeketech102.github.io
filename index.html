<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bean Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 2px 2px 12px rgba(0,0,0,0.1);
            background-color: #fcfbfa;
            position: relative;
            overflow-x: hidden;
            min-height: 500px;
        }
        
        /* Floating Bean Background Styles */
        .falling-bean {
            position: fixed;
            top: -50px;
            font-size: 24px;
            user-select: none;
            pointer-events: none;
            z-index: -1;
            animation: fall linear infinite, spin linear infinite;
        }

        @keyframes fall {
            0% {
                top: -50px;
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                top: 105vh;
                opacity: 0;
            }
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* UI Styles */
        .container {
            position: relative;
            z-index: 1;
            background: rgba(252, 251, 250, 0.95);
            padding: 10px;
            border-radius: 8px;
        }
        h2 {
            color: #5c4033;
            text-align: center;
            margin-top: 10px;
        }
        label {
            font-weight: bold;
            color: #4a3525;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px 0;
            box-sizing: border-box;
            border: 1px solid #a67c52;
            border-radius: 4px;
        }
        .result {
            font-size: 1.3em;
            font-weight: bold;
            color: #2e1f15;
            margin-top: 15px;
            text-align: center;
            background-color: #f0e6df;
            padding: 15px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🫘 Bean Converter</h2>
        
        <label for="conversionType">Conversion Mode:</label>
        <select id="conversionType" onchange="convert()">
            <option value="moneyToBeans">Money to Beans (3:1 Division)</option>
            <option value="multiplyThreeToOne">Multiply (3 → 1 Option)</option>
            <option value="divideOneToThree">Divide (1 → 3 Option)</option>
        </select>

        <label for="inputValue">Enter Value:</label>
        <input type="number" id="inputValue" placeholder="Type a number..." oninput="convert()">

        <div class="result">
            Result: <span id="outputValue">0</span>
        </div>
    </div>

    <script>
        function convert() {
            const input = parseFloat(document.getElementById('inputValue').value);
            const type = document.getElementById('conversionType').value;
            const output = document.getElementById('outputValue');

            if (isNaN(input)) {
                output.innerText = '0';
                return;
            }

            if (type === 'moneyToBeans') {
                // New 3-1 logic (Input 3 -> Output 1, Input 6 -> Output 2)
                output.innerText = (input / 3).toFixed(2).replace(/\.00\$/, '');
            } else if (type === 'multiplyThreeToOne') {
                output.innerText = (input * 3).toFixed(2).replace(/\.00\$/, '');
            } else {
                output.innerText = (input / 3).toFixed(2).replace(/\.00\$/, '');
            }
        }

        // Script to generate floating, spinning bean emojis
        function createBean() {
            const bean = document.createElement('div');
            bean.classList.add('falling-bean');
            bean.innerText = '🫘';
            
            // Randomize starting horizontal position
            bean.style.left = Math.random() * 100 + 'vw';
            
            // Randomize speed of falling (between 6 and 12 seconds)
            const fallDuration = Math.random() * 6 + 6;
            // Randomize speed of spinning (between 4 and 8 seconds)
            const spinDuration = Math.random() * 4 + 4;
            
            bean.style.animationDuration = `${fallDuration}s, ${spinDuration}s`;
            
            // Randomize direction of spin (clockwise or counter-clockwise)
            if (Math.random() > 0.5) {
                bean.style.animationDirection = 'normal, reverse';
            }

            document.body.appendChild(bean);

            // Remove bean after it falls off screen to keep the page fast
            setTimeout(() => {
                bean.remove();
            }, fallDuration * 1000);
        }

        // Spawn a new bean every 800 milliseconds
        setInterval(createBean, 800);
    </script>

</body>
</html>
