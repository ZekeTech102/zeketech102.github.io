<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>3:1 Ratio Converter</title> <style> body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; box-shadow: 2px 2px 12px rgba(0,0,0,0.1); } input, select { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; } .result { font-size: 1.2em; font-weight: bold; color: #333; margin-top: 15px; } </style> </head> <body> <h2>3:1 Ratio Converter</h2> <label for="conversionType">Choose direction:</label> <select id="conversionType" onchange="convert()"> <option value="multiply">Multiply (1 → 3)</option> <option value="divide">Divide (3 → 1)</option> </select> <label for="inputValue">Enter Number:</label> <input type="number" id="inputValue" placeholder="Type a number..." oninput="convert()"> <div class="result"> Result: <span id="outputValue">0</span> </div> <script> function convert() { const input = parseFloat(document.getElementById('inputValue').value); const type = document.getElementById('conversionType').value; const output = document.getElementById('outputValue'); if (isNaN(input)) { output.innerText = '0'; return; } if (type === 'multiply') { output.innerText = (input * 3).toFixed(2).replace(/\.00$/, ''); } else { output.innerText = (input / 3).toFixed(2).replace(/\.00$/, ''); } } </script> </body> </html>
