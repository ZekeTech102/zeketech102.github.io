<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tuner – IPTV player</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap">
<style>
:root{--bg:#eceff5;--panel:#fff;--p2:#e6e9f1;--line:#d8dce8;--text:#131827;--mute:#667088;--ac:#2f5bff;--live:#ff3b5c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d111d;--panel:#151b2d;--p2:#1d2540;--line:#273152;--text:#e9eeff;--mute:#8a96b8;--ac:#6f8dff}}
:root[data-theme="dark"]{--bg:#0d111d;--panel:#151b2d;--p2:#1d2540;--line:#273152;--text:#e9eeff;--mute:#8a96b8;--ac:#6f8dff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{display:grid;grid-template-columns:350px 1fr;height:100%}
aside{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:18px 16px 12px}
.logo{flex:1;font-weight:800;font-size:22px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.logo:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--live)}
.btn{padding:9px 15px;border-radius:10px;background:var(--p2);font-weight:600}
.btn.pri{background:var(--ac);color:#fff}
.btn:hover{filter:brightness(1.1)}
.in{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--p2);outline:0}
.in:focus{border-color:var(--ac)}
.srch{margin:0 16px 10px;width:calc(100% - 32px)}
.chips{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;padding:6px 13px;border-radius:99px;background:var(--p2);color:var(--mute);font-weight:600;font-size:13px}
.chip.on{background:var(--text);color:var(--bg)}
.list{flex:1;min-height:0;overflow-y:auto;padding:4px 8px 16px}
.row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer}
.row:hover{background:var(--p2)}
.row.on{background:var(--p2);box-shadow:inset 3px 0 0 var(--live)}
.num{width:34px;text-align:right;color:var(--mute);font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
.row.on .num{color:var(--live)}
.nm{flex:1;min-width:0}
.nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{color:var(--mute)}
.star{padding:4px 6px;color:var(--mute);font-size:17px}
.star.on{color:#f5b301}
.hint{color:var(--mute);font-size:13px;margin:0}
main{display:flex;flex-direction:column;justify-content:center;min-width:0;min-height:0;padding:28px;overflow-y:auto}
.wrap{width:100%;max-width:1080px;margin:0 auto}
.stage{position:relative;aspect-ratio:16/9;background:#000;border-radius:20px;overflow:hidden;box-shadow:0 24px 60px -24px rgba(5,10,30,.6)}
video{width:100%;height:100%;display:block;background:#000}
.ov{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:#080b14;color:#fff}
.ov[hidden]{display:none}
.ov h2{margin:0 0 6px;font-size:22px;letter-spacing:-.02em}
.ov p{margin:0 auto 16px;max-width:380px;color:#9aa6c8}
.big{width:60px;height:60px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;font-size:22px;background:var(--live)}
.sp{width:34px;height:34px;margin:0 auto 14px;border:3px solid #2a3350;border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sp{animation-duration:3s}}
.now{display:flex;align-items:center;gap:10px;margin-top:18px}
.now div{flex:1;min-width:0}
h1{margin:0;font-size:22px;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:18px}
.ib:hover{background:var(--p2)}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--text);padding:0;width:min(520px,calc(100vw - 24px));position:fixed}
dialog::backdrop{background:rgba(5,8,20,.65);backdrop-filter:blur(4px)}
.tabs{display:flex;gap:4px;padding:14px 56px 0 14px;overflow-x:auto;scrollbar-width:none}
.tab{padding:8px 12px;border-radius:10px;color:var(--mute);font-weight:600;white-space:nowrap}
.tab.on{background:var(--p2);color:var(--text)}
.x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:10px;color:var(--mute);font-size:16px}
.pane{padding:16px 20px 20px;display:grid;gap:10px}
.pane[hidden]{display:none}
textarea.in{min-height:140px;resize:vertical;font:12px ui-monospace,Menlo,monospace}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:9;max-width:90vw;text-align:center}
.toast[hidden]{display:none}
@media (max-width:860px){
.app{display:flex;flex-direction:column}
main{order:-1;flex:none;padding:12px;overflow:visible}
aside{flex:1;border-right:0;border-top:1px solid var(--line)}
.stage{border-radius:14px}
h1{font-size:18px}
}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="top"><div class="logo">Tuner</div><button class="btn pri" data-add>Add channels</button></div>
  <input class="in srch" id="q" type="search" placeholder="Search channels" aria-label="Search channels">
  <div class="chips" id="chips"></div>
  <div class="list" id="list"></div>
</aside>
<main><div class="wrap">
  <div class="stage"><video id="v" controls playsinline></video><div class="ov" id="ov"></div></div>
  <div class="now">
    <div><h1 id="t">Pick a channel</h1><p class="hint" id="g">Your list is on the left.</p></div>
    <button class="ib" id="prev" title="Previous channel" aria-label="Previous channel">‹</button>
    <button class="ib" id="next" title="Next channel" aria-label="Next channel">›</button>
    <button class="ib" id="fav" title="Favorite" aria-label="Favorite">☆</button>
    <button class="ib" id="rm" title="Remove channel" aria-label="Remove channel">✕</button>
  </div>
</div></main>
</div>

<dialog id="dlg">
  <button class="x" data-close aria-label="Close">✕</button>
  <div class="tabs">
    <button class="tab on" data-p="p1">Playlist link</button>
    <button class="tab" data-p="p2">Paste playlist</button>
    <button class="tab" data-p="p3">Single channel</button>
    <button class="tab" data-p="p4">Move or back up</button>
  </div>
  <div class="pane" id="p1">
    <p class="hint">Paste the M3U or M3U8 link from your IPTV provider.</p>
    <input class="in" id="pu" placeholder="https://example.com/playlist.m3u">
    <p class="hint">If the link fails to load, open it in a new tab, copy the text, and use Paste playlist.</p>
    <button class="btn pri" id="goUrl">Add playlist</button>
  </div>
  <div class="pane" id="p2" hidden>
    <textarea class="in" id="pt" placeholder="#EXTM3U&#10;#EXTINF:-1,Channel name&#10;https://example.com/stream.m3u8"></textarea>
    <button class="btn pri" id="goPaste">Add channels</button>
  </div>
  <div class="pane" id="p3" hidden>
    <input class="in" id="n1" placeholder="Channel name">
    <input class="in" id="u1" placeholder="Stream link (.m3u8)">
    <input class="in" id="g1" placeholder="Group (optional)">
    <button class="btn pri" id="goOne">Add channel</button>
  </div>
  <div class="pane" id="p4" hidden>
    <p class="hint">Channels are saved in this browser. To watch on another device, copy a backup code here and paste it there.</p>
    <button class="btn pri" id="cp">Copy backup code</button>
    <textarea class="in" id="bk" placeholder="Paste a backup code here"></textarea>
    <button class="btn" id="goBk">Restore from code</button>
    <button class="btn" id="clr">Remove all channels</button>
  </div>
</dialog>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY="tuner.v1";
let S={ch:[],cur:null,f:"all",q:""},hls=null,tt;
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.ch)){S.ch=d.ch;S.cur=d.cur}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({ch:S.ch,cur:S.cur}))}catch(e){}};
const toast=m=>{const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3000)};
const get=id=>S.ch.find(c=>c.id===id);

function parseM3U(t){const out=[];let m=null;
 for(const raw of t.split(/\r?\n/)){const l=raw.trim();if(!l)continue;
  if(l.startsWith("#EXTINF")){const a=k=>(l.match(new RegExp(k+'="([^"]*)"',"i"))||[])[1]||"";
   const q=l.lastIndexOf('"'),c=l.indexOf(",",q<0?0:q);
   m={name:(c>=0?l.slice(c+1).trim():"")||a("tvg-name"),group:a("group-title")||"Other"}}
  else if(l[0]!=="#"){if(/^https?:\/\//i.test(l))out.push({name:m&&m.name||l,group:m?m.group:"Other",url:l});m=null}}
 return out}

function add(list){const have=new Set(S.ch.map(c=>c.url));let n=0;
 for(const c of list){if(!c.url||have.has(c.url))continue;have.add(c.url);
  S.ch.push({id:"c"+Math.random().toString(36).slice(2,10),name:c.name||"Untitled",group:c.group||"Other",url:c.url,fav:!!c.fav});n++}
 save();chips();rows();return n}

const vis=()=>{let a=S.ch;if(S.f==="fav")a=a.filter(c=>c.fav);else if(S.f!=="all")a=a.filter(c=>c.group===S.f);
 const q=S.q.trim().toLowerCase();return q?a.filter(c=>c.name.toLowerCase().includes(q)):a};

function chips(){const n={};S.ch.forEach(c=>n[c.group]=(n[c.group]||0)+1);
 const g=Object.keys(n).sort((a,b)=>n[b]-n[a]).slice(0,40);
 $("#chips").innerHTML=[["all","All"],["fav","Favorites"],...g.map(x=>[x,x])]
  .map(([k,l])=>`<button class="chip${S.f===k?" on":""}" data-f="${esc(k)}">${esc(l)}</button>`).join("")}

function rows(){const a=vis(),cut=a.slice(0,250);
 $("#list").innerHTML=cut.length?cut.map(c=>`<div class="row${c.id===S.cur?" on":""}" data-id="${c.id}"><span class="num">${S.ch.indexOf(c)+1}</span><div class="nm"><b>${esc(c.name)}</b><small>${esc(c.group)}</small></div><button class="star${c.fav?" on":""}" data-fav="${c.id}" aria-label="Favorite">${c.fav?"★":"☆"}</button></div>`).join("")
  +(a.length>250?`<p class="hint" style="padding:10px 12px">Showing 250 of ${a.length}. Search to narrow the list.</p>`:"")
  :`<p class="hint" style="padding:28px 16px;text-align:center">${S.ch.length?"No channels match.":"No channels yet. Add a playlist to start watching."}</p>`}

function ov(k){const o=$("#ov");o.hidden=!k;if(!k)return;
 const M={empty:["Add your first channel","Paste an IPTV playlist link or a single stream link and it will show up here."],load:["Tuning in…",""],err:["This channel won’t play","It may be offline, blocked by the provider, or served over http while this page is https. Try another channel."]}[k];
 o.innerHTML="<div>"+(k==="load"?'<div class="sp"></div>':`<div class="big">${k==="err"?"!":"▶"}</div>`)+`<h2>${M[0]}</h2><p>${M[1]}</p>`
  +(k==="empty"?'<button class="btn pri" data-add>Add channels</button>':k==="err"?'<button class="btn" data-retry>Try again</button>':"")+"</div>"}

function stop(){if(hls){hls.destroy();hls=null}const v=$("#v");v.pause();v.removeAttribute("src");v.load()}

function play(id){const c=get(id);if(!c){S.cur=null;stop();ov("empty");$("#t").textContent="Pick a channel";$("#g").textContent="Your list is on the left.";return}
 S.cur=id;save();rows();$("#t").textContent=c.name;$("#g").textContent=c.group;$("#fav").textContent=c.fav?"★":"☆";
 stop();ov("load");
 const v=$("#v"),u=c.url,go=()=>v.play().catch(()=>{});
 if(!/\.(mp4|webm|ogv)(\?|$)/i.test(u)&&window.Hls&&Hls.isSupported()){
  hls=new Hls({lowLatencyMode:true});
  hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)ov("err")});
  hls.on(Hls.Events.MANIFEST_PARSED,go);
  hls.loadSource(u);hls.attachMedia(v)}
 else{v.src=u;go()}}

const step=d=>{const a=vis();if(!a.length)return;const i=a.findIndex(c=>c.id===S.cur);play(a[(i+d+a.length)%a.length].id)};
const v=$("#v");
["playing","canplay"].forEach(e=>v.addEventListener(e,()=>S.cur&&ov(null)));
v.addEventListener("error",()=>{if(v.error&&S.cur)ov("err")});

function fav(id){const c=get(id);if(!c)return;c.fav=!c.fav;save();rows();if(id===S.cur)$("#fav").textContent=c.fav?"★":"☆"}
function done(L){const n=add(L);if(!L.length){toast("No channels found. Check the link or text.");return}
 toast(n?`Added ${n} channel${n===1?"":"s"}`:"Those channels are already in your list.");$("#dlg").close();if(!S.cur&&S.ch.length)play(S.ch[0].id)}

document.addEventListener("click",e=>{const t=e.target;let x;
 if(x=t.closest("[data-fav]"))return fav(x.dataset.fav);
 if(x=t.closest(".row"))return play(x.dataset.id);
 if(x=t.closest("[data-f]")){S.f=x.dataset.f;chips();return rows()}
 if(t.closest("[data-add]"))return $("#dlg").showModal();
 if(t.closest("[data-close]"))return $("#dlg").close();
 if(t.closest("[data-retry]"))return play(S.cur);
 if(x=t.closest(".tab")){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b===x));
  document.querySelectorAll(".pane").forEach(p=>p.hidden=p.id!==x.dataset.p)}});

$("#q").oninput=e=>{S.q=e.target.value;rows()};
$("#prev").onclick=()=>step(-1);$("#next").onclick=()=>step(1);
$("#fav").onclick=()=>S.cur&&fav(S.cur);
$("#rm").onclick=()=>{if(!S.cur)return;S.ch=S.ch.filter(c=>c.id!==S.cur);save();chips();rows();play(null)};
document.addEventListener("keydown",e=>{if(e.target.matches("input,textarea")||$("#dlg").open)return;
 if(e.key==="ArrowUp"){e.preventDefault();step(-1)}if(e.key==="ArrowDown"){e.preventDefault();step(1)}});

$("#goUrl").onclick=async()=>{const u=$("#pu").value.trim();if(!u)return;toast("Loading playlist…");
 try{const r=await fetch(u);if(!r.ok)throw 0;done(parseM3U(await r.text()))}
 catch(e){toast("Couldn’t load that link. Open it in a tab and use Paste playlist.")}};
$("#goPaste").onclick=()=>{const t=$("#pt").value;if(t.trim()){done(parseM3U(t));$("#pt").value=""}};
$("#goOne").onclick=()=>{const u=$("#u1").value.trim();if(!/^https?:\/\//i.test(u))return toast("Enter a stream link that starts with http:// or https://");
 add([{name:$("#n1").value.trim()||"Untitled",group:$("#g1").value.trim()||"My channels",url:u}]);
 const c=S.ch.find(x=>x.url===u);["#n1","#u1","#g1"].forEach(s=>$(s).value="");$("#dlg").close();if(c)play(c.id)};
$("#cp").onclick=async()=>{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S.ch))));
 try{await navigator.clipboard.writeText(code);toast("Backup code copied")}
 catch(e){$("#bk").value=code;$("#bk").select();toast("Copy the code from the box")}};
$("#goBk").onclick=()=>{try{const L=JSON.parse(decodeURIComponent(escape(atob($("#bk").value.trim()))));done(L)}
 catch(e){toast("That code doesn’t look right.")}};
let armed=0;$("#clr").onclick=function(){if(!armed){armed=1;this.textContent="Tap again to remove everything";setTimeout(()=>{armed=0;this.textContent="Remove all channels"},3500);return}
 armed=0;this.textContent="Remove all channels";S.ch=[];save();chips();rows();play(null);$("#dlg").close();toast("All channels removed")};

chips();rows();
async function loadConfig(){try{
 const r=await fetch("config.yml",{cache:"no-store"});if(!r.ok||!window.jsyaml)return;
 const c=jsyaml.load(await r.text());if(!c||typeof c!=="object")return;
 let n=0;
 if(Array.isArray(c.channels))n+=add(c.channels.filter(x=>x&&/^https?:\/\//i.test(x.url)));
 for(const u of Array.isArray(c.playlists)?c.playlists:[]){try{const p=await fetch(u);if(p.ok)n+=add(parseM3U(await p.text()))}catch(e){}}
 if(n){toast(`Loaded ${n} channel${n===1?"":"s"} from config.yml`);if(!S.cur)play(S.ch[0].id)}
}catch(e){}}

if(S.cur&&get(S.cur))play(S.cur);else{S.cur=null;ov("empty")}
loadConfig();
</script>
</body>
</html>
