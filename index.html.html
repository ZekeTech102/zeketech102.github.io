<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bean Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fcfbfa;
            overflow-x: hidden;
            min-height: 100vh;
            user-select: none;
        }
        
        /* Floating Bean Background Styles */
        .falling-bean {
            position: fixed;
            top: -50px;
            font-size: 28px;
            cursor: pointer;
            z-index: 10;
            animation: fall linear infinite, spin linear infinite;
            transition: transform 0.1s ease;
        }
        .falling-bean:active {
            transform: scale(1.4);
        }

        @keyframes fall {
            0% { top: -50px; opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { top: 105vh; opacity: 0; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Score Tracker Overlay */
        #scoreBoard {
            position: fixed;
            top: 15px;
            left: 15px;
            background: rgba(92, 64, 51, 0.9);
            color: #fff;
            padding: 10px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1em;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* View Switching Logic */
        .page {
            display: none;
            padding: 20px;
            box-sizing: border-box;
        }
        .page.active {
            display: block;
        }

        /* --- CONVERTER VIEW --- */
        #converterView {
            max-width: 400px;
            margin: 60px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 2px 2px 12px rgba(0,0,0,0.1);
            background: rgba(252, 251, 250, 0.95);
            position: relative;
            z-index: 5;
        }
        h2 { color: #5c4033; text-align: center; margin-top: 10px; }
        label { font-weight: bold; color: #4a3525; }
        input, select {
            width: 100%; padding: 10px; margin: 10px 0 20px 0;
            box-sizing: border-box; border: 1px solid #a67c52; border-radius: 4px;
        }
        .result {
            font-size: 1.3em; font-weight: bold; color: #2e1f15; text-align: center;
            background-color: #f0e6df; padding: 15px; border-radius: 6px;
        }

        /* --- GAME ARCADE VIEW --- */
        #gameView {
            max-width: 600px;
            margin: 60px auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            text-align: center;
            border: 2px solid #5c4033;
            position: relative;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 25px;
            margin-bottom: 25px;
        }
        .game-btn {
            background-color: #5c4033;
            color: #fff;
            padding: 20px;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .game-btn:hover { background-color: #7a5847; transform: translateY(-2px); }
        .game-btn:active { transform: translateY(0); }
        .game-btn.mc { background-color: #3c8527; }
        .game-btn.mc:hover { background-color: #4da633; }
        .game-btn.gd { background-color: #00b4ff; }
        .game-btn.gd:hover { background-color: #33c3ff; }
        .game-btn.other { background-color: #8844ee; }
        .game-btn.other:hover { background-color: #9955ff; }

        /* --- EMBEDDED GAME VIEW --- */
        #minecraftGameView {
            max-width: 900px;
            margin: 40px auto;
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            text-align: center;
            border: 2px solid #3c8527;
        }
        .iframe-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            margin-bottom: 20px;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Return Button styling */
        .return-btn {
            display: inline-block;
            background-color: #e06666;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        .return-btn:hover { background-color: #cc0000; }
    </style>
</head>
<body>

    <!-- Score Overlay (Top Left) -->
    <div id="scoreBoard">Score: <span id="scoreValue">0</span> 🫘</div>

    <!-- MAIN CONVERTER PAGE -->
    <div id="converterPage" class="page active">
        <div id="converterView">
            <h2>🫘 Bean Converter</h2>
            
            <label for="conversionType">Conversion Mode:</label>
            <select id="conversionType" onchange="convert()">
                <option value="moneyToBeans">Money to Beans (3:1 Division)</option>
                <option value="multiplyThreeToOne">Multiply (3 → 1 Option)</option>
                <option value="divideOneToThree">Divide (1 → 3 Option)</option>
            </select>

            <label for="inputValue">Enter Value:</label>
            <input type="number" id="inputValue" placeholder="Type a number..." oninput="convert()">

            <div class="result">
                Result: <span id="outputValue">0</span>
            </div>
        </div>
    </div>

    <!-- ARCADE PAGE (SECRET) -->
    <div id="arcadePage" class="page">
        <div id="gameView">
            <h2>🎮 Bean Arcade</h2>
            <p>Click a game below to play.</p>
            
            <div class="game-grid">
                <!-- Minecraft button modified to open embedded game view directly within the site -->
                <button onclick="openMinecraftGame()" class="game-btn mc">⛏️ Minecraft (Classic)</button>
                <a href="https://geometrydash.io" target="_blank" class="game-btn gd">🔺 Geometry Dash</a>
                <a href="https://poki.com" target="_blank" class="game-btn other">🕹️ Poki Games</a>
                <a href="https://crazygames.com" target="_blank" class="game-btn other">🚀 CrazyGames</a>
            </div>
            
            <button class="return-btn" onclick="returnToConverter()">↩️ ESC to Return</button>
        </div>
    </div>

    <!-- EMBEDDED MINECRAFT GAME PAGE -->
    <div id="minecraftGamePage" class="page">
        <div id="minecraftGameView">
            <h2>⛏️ Minecraft Classic (Embedded Mode)</h2>
            <div class="iframe-container">
                <!-- Embedded HTML version of classic minecraft -->
                <iframe src="https://classic.minecraft.net" allow="fullscreen; autoplay"></iframe>
            </div>
            <button class="return-btn" onclick="returnToArcade()">↩️ Back to Arcade</button>
        </div>
    </div>

    <script>
        let score = 0;

        // Converter Logic
        function convert() {
            const input = parseFloat(document.getElementById('inputValue').value);
            const type = document.getElementById('conversionType').value;
            const output = document.getElementById('outputValue');

            if (isNaN(input)) {
                output.innerText = '0';
                return;
            }

            if (type === 'moneyToBeans' || type === 'divideOneToThree') {
                output.innerText = (input / 3).toFixed(2).replace(/\.00\$/, '');
            } else if (type === 'multiplyThreeToOne') {
                output.innerText = (input * 3).toFixed(2).replace(/\.00\$/, '');
            }
        }

        // Functions to switch views
        function hideAllPages() {
            document.getElementById('converterPage').classList.remove('active');
            document.getElementById('arcadePage').classList.remove('active');
            document.getElementById('minecraftGamePage').classList.remove('active');
        }

        function returnToConverter() {
            hideAllPages();
            document.getElementById('converterPage').classList.add('active');
        }

        function openArcade() {
            hideAllPages();
            document.getElementById('arcadePage').classList.add('active');
        }

        function openMinecraftGame() {
            hideAllPages();
            document.getElementById('minecraftGamePage').classList.add('active');
        }

        function returnToArcade() {
            hideAllPages();
            document.getElementById('arcadePage').classList.add('active');
        }

        // Keyboard Controls (P and Escape)
        window.addEventListener('keydown', function(event) {
            // Ignore keystrokes if typing inside the input box
            if (document.activeElement.tagName === 'INPUT') {
                if (event.key.toLowerCase() === 'p') return; 
            }

            if (event.key.toLowerCase() === 'p') {
                openArcade();
            }
            if (event.key === 'Escape' || event.key === 'Esc') {
                // If we are looking at Minecraft, ESC goes back to Arcade first. If in Arcade, ESC goes back to Converter.
                if (document.getElementById('minecraftGamePage').classList.contains('active')) {
                    returnToArcade();
                } else if (document.getElementById('arcadePage').classList.contains('active')) {
                    returnToConverter();
                }
            }
        });

        // Falling & Clickable Beans Logic
        function createBean() {
            const bean = document.createElement('div');
            bean.classList.add('falling-bean');
            bean.innerText = '🫘';
            
            bean.style.left = Math.random() * 95 + 'vw';
            
            const fallDuration = Math.random() * 6 + 6;
            const spinDuration = Math.random() * 4 + 4;
            
            bean.style.animationDuration = `${fallDuration}s, ${spinDuration}s`;
            if (Math.random() > 0.5) {
                bean.style.animationDirection = 'normal, reverse';
            }

            // Click Handler
            bean.addEventListener('mousedown', function() {
                score++;
                document.getElementById('scoreValue').innerText = score;
                bean.style.transform = 'scale(0)';
                setTimeout(() => bean.remove(), 100);
            });

            document.body.appendChild(bean);

            setTimeout(() => {
                if (bean.parentNode) bean.remove();
            }, fallDuration * 1000);
        }

        setInterval(createBean, 800);
    </script>

</body>
</html>
